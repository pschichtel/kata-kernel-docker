name: Docker Image CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  create:
    tags:
      - v*


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
    - name: Login to GitHub Container Registry
      uses: docker/login-action@06fb636fac595d6fb4b28a5dfcb21a6f5091859c # v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
    - name: Determine image name
      id: image
      run: echo "name=ghcr.io/pschichtel/kata-kernel:${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
    - name: Build and push the Docker image
      uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
      with:
        context: .
        push: true
        tags: ${{ steps.image.outputs.name }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

